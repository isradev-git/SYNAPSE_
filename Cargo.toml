[workspace]
members = [
    "crates/SYNAPSE_-app",
    "crates/SYNAPSE_-renderer",
    "crates/SYNAPSE_-ui",
    "crates/SYNAPSE_-config",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["SYNAPSE_ Team"]
repository = "https://github.com/isradev-git/synapse_"
homepage = "https://github.com/isradev-git/synapse_"
description = "A cyberpunk GPU-accelerated terminal emulator"

[workspace.dependencies]
winit = "0.30"
wgpu = "22"
fontdue = "0.9"
alacritty_terminal = "0.24"
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
arboard = "3"
tracing = "0.1"
tracing-subscriber = "0.3"
bitflags = "2"
clap = { version = "4", features = ["derive"] }
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }

[profile.dist]
inherits = "release"
lto = "thin"
