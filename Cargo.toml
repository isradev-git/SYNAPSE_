[workspace]
members = [
    "crates/Luna-app",
    "crates/Luna-terminal",
    "crates/Luna-renderer",
    "crates/Luna-ui",
    "crates/Luna-config",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Luna Team"]
repository = "https://github.com/Luna/Luna"
homepage = "https://github.com/Luna/Luna"
description = "A modern GPU-accelerated terminal emulator"

[workspace.dependencies]
winit = "0.30"
wgpu = "22"
cosmic-text = "0.12"
portable-pty = "0.8"
vte = "0.13"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
arboard = "3"
tracing = "0.1"
tracing-subscriber = "0.3"
bitflags = "2"
clap = { version = "4", features = ["derive"] }
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
